name: CI

on:
  pull_request:

permissions:
  contents: read

env:
  SKILLCRAFT: plugins/skillcraft/skills/skillcraft

jobs:
  python:
    name: Python and skill validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r "$SKILLCRAFT/requirements.txt"
      - name: Test Python
        run: python -B -m unittest discover -s tests -t .
      - name: Validate the skill
        run: python "$SKILLCRAFT/scripts/quick_validate.py" "$SKILLCRAFT" --json

  javascript:
    name: Viewer, OpenCode, and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install OpenCode runner dependencies
        run: npm --prefix "$SKILLCRAFT/scripts/opencode-runner" ci
      - name: Test Viewer
        run: node --test tests/viewer.test.mjs
      - name: Test the OpenCode plugin
        run: node --test tests/opencode/*.test.mjs
      - name: Test the OpenCode runner
        run: |
          "$SKILLCRAFT/scripts/opencode-runner/node_modules/.bin/tsx" --test tests/opencode/*.test.mts
      - name: Check TypeScript
        run: npm --prefix "$SKILLCRAFT/scripts/opencode-runner" run check
